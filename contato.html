    <main>
    <form action="https://formspree.io/f/xwpalkrz" method="post">
    <fieldset>
       <p class="p3"><strong>Entre em Contato</strong></p>
        <label for="Nome">Nome <br><input class="nome" type="text" required name="Nome"  size="80" maxlength="52">
             <div>
                    <label for="e-mail">E-Mail <br>
                        <input class="e" type="text" required name="e-mail" id="e-mail" size="80">
                    </label>
                 </div>
<div>
 <label for="celular">WhatsApp <br>
                        <input class="cel" type="text" required name="celular" id="celular" size="80" maxlength="13" placeholder="(DDD)-90000-0000">
                    </label>
                </div>
                <div>
                    <label for="assunto">Assunto <br><input type="text"class="assunto" type="text" required name="Nome" id="assunto" size="80" maxlength="52"></label></div>
                <div>
                    <label for="comentário">Mensagem <br>
                    <textarea class="mensagem" name="mensagem" id="mensagem" cols="80" rows="8" style="resize:none"></textarea>
                    </label>
                </div>
                <button class="button2" type="submit">Enviar Mensagem </button>
    </fieldset> 
    </form>
     <script>
          $('#celular').mask('(000) 00000-0000');
    </script>
